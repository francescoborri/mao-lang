<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mao playground (v1.0)</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fbfaf8; --fg: #1d1d1f; --muted: #6b6b70;
      --panel: #ffffff; --line: #d9d6cf; --accent: #b5470c; --accent-fg: #ffffff;
      --err: #b3261e; --err-bg: #fdecea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17171a; --fg: #ececef; --muted: #9a9aa2;
        --panel: #1f1f23; --line: #36363c; --accent: #f08a4b; --accent-fg: #1a1208;
        --err: #ff8a80; --err-bg: #3a1f1d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { max-width: 64rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    p.lead { margin: 0 0 1.5rem; color: var(--muted); }
    .grid { display: grid; gap: 1.25rem; grid-template-columns: 1fr 1fr; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    label, .label { display: block; font-weight: 600; margin-bottom: .4rem; }
    textarea, pre {
      width: 100%; min-height: 20rem; margin: 0; padding: .9rem;
      background: var(--panel); color: var(--fg);
      border: 1px solid var(--line); border-radius: 6px;
      font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    textarea { resize: vertical; tab-size: 2; }
    pre { overflow: auto; white-space: pre-wrap; }
    pre.error { color: var(--err); background: var(--err-bg); border-color: var(--err); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .bar { display: flex; align-items: center; gap: 1rem; margin-top: .75rem; }
    button {
      font: inherit; font-weight: 600; padding: .55rem 1.2rem; cursor: pointer;
      background: var(--accent); color: var(--accent-fg);
      border: 0; border-radius: 6px;
    }
    button.secondary {
      background: transparent; color: var(--fg); border: 1px solid var(--line);
    }
    button:disabled { opacity: .45; cursor: default; }
    #status { color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
<main>
  <h1>Mao playground (v1.0)</h1>
  <p class="lead">A simple, imperative programming language for learning.</p>

  <div class="grid">
    <section>
      <label for="src">Program</label>
      <textarea id="src" spellcheck="false">int n = 8;
int f0 = 0;
int f1 = 1;
int fib = f0;
while (n > 0) {
  fib := f1;
  f1 := f1 + f0;
  f0 := fib;
  n := n - 1;
}
      </textarea>
      <div class="bar">
        <button id="run" disabled>Run</button>
        <button id="cancel" class="secondary" disabled>Cancel</button>
        <span id="status">Loading interpreter…</span>
      </div>
    </section>
    <section>
      <div class="label" id="out-label">Final state</div>
      <pre id="out" aria-labelledby="out-label" aria-live="polite"></pre>
    </section>
  </div>
</main>

<script src="app.js" defer></script>
</body>
</html>
